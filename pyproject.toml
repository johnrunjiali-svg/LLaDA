[project]
name = "llada"
version = "0.1.0"
description = "Working copy of LLaDA (Large Language Diffusion with mAsking)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.5",
    "transformers>=4.49,<5",
    "tokenizers>=0.21",
    "huggingface-hub>=0.30",
    "safetensors>=0.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Server-side extras: training / evaluation / demo. Install with `uv sync --extra eval`.
eval = [
    "accelerate>=1.0",
    "datasets>=3.0",
    "lm-eval>=0.4.8",
]
demo = [
    "gradio>=5.0",
]
dev = [
    "ipython>=8.0",
    "jupyter>=1.0",
]

[tool.uv]
# Keep the lockfile universal so the same uv.lock resolves on macOS (MPS) and
# Linux (CUDA). The default PyPI torch wheels are already CUDA-enabled on
# linux-x86_64 and MPS-enabled on macOS-arm64, so no custom index is needed.
# If the server ever needs a specific CUDA build, uncomment the block below.

# [[tool.uv.index]]
# name = "pytorch-cu128"
# url = "https://download.pytorch.org/whl/cu128"
# explicit = true
#
# [tool.uv.sources]
# torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
